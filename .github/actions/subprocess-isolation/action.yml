name: Subprocess isolation
description: Installs what CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs on the runner

# claude-code-action runs these same steps only when allowed_non_write_users is set.
# Without bubblewrap, Claude Code with the scrub on fails already at install.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap socat
        # Ubuntu 24.04+ blocks the unprivileged user namespaces bubblewrap needs, through AppArmor
        if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
