name: Deploy

on:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # When called from the merge workflow the event is the PR, so name master explicitly
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # Publishes to the gh-pages branch, keeping the PR previews under pr-preview/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          clean-exclude: pr-preview/
          force: false
