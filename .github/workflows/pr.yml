name: PR checks and preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

jobs:
  # Required by the master ruleset, so keep the job name in sync with scripts/setup-repo.sh
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  preview:
    # Fork PRs get a read-only token, so they can't publish a preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build

      # Deploys dist/ to <pages-url>/pr-preview/pr-<number>/ and comments the link; removes it when the PR closes
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
