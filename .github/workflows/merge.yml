name: Merge on approval

on:
  pull_request_review:
    types: [submitted]

jobs:
  merge:
    # A collaborator clicked "Approve" on an agent PR
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
      github.event.pull_request.user.login == 'claude[bot]'
    runs-on: ubuntu-latest
    # Same group as the agents, so a merge waits for a running agent to finish
    concurrency:
      group: agent-${{ github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      # To close the ticket and its idea
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Clear needs-human from an earlier run
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/needs-human" || true

      - name: Squash-merge into master
        id: merge
        run: |
          if ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx done; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Not merged: the agents aren't done yet. Approve again once the PR has the \`done\` label."
            exit 1
          fi
          if ! out=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch 2>&1); then
            printf 'Not merged:\n\n```\n%s\n```\n\nUsually a conflict with master or a failing `check`. Fix it, then approve again.\n' "$out" |
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
            exit 1
          fi

      # GitHub ignores `Closes #N` when GITHUB_TOKEN merges, even with issues: write
      - name: Close the ticket, and its idea once all its tickets are closed
        run: |
          for ticket in $(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
            gh issue close "$ticket" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Done in #$PR."
            # On a 404, gh api prints the error body to stdout, so keep nothing from a failed lookup
            idea=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ticket/parent" --jq .number 2>/dev/null) || continue
            if gh api "repos/$GITHUB_REPOSITORY/issues/$idea/sub_issues?per_page=100" --jq 'all(.state == "closed")' | grep -qx true; then
              gh issue close "$idea" --repo "$GITHUB_REPOSITORY" --reason completed --comment "All its tickets are done."
            fi
          done

      # The merge step comments on its own failures
      - uses: ./.github/actions/needs-human
        if: failure() && steps.merge.outcome != 'failure'
        with:
          number: ${{ env.PR }}

  # A merge made with GITHUB_TOKEN starts no other workflows, so deploy and preview cleanup run from here
  deploy:
    needs: merge
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml

  remove-preview:
    # After deploy, so the two never push to gh-pages at the same time
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          pr-number: ${{ github.event.pull_request.number }}

  # Skipped along with merge, so a run where nothing ran stays skipped and the next prune deletes it
  prune:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result != 'skipped' }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-skipped-runs.yml
