name: "Agent: grill idea"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  grill:
    # Starts on the `idea` label; after that, each collaborator comment on an `idea` issue runs one more round
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'idea') ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.issue.labels.*.name, 'idea'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-${{ github.event.issue.number }}
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      NUMBER: ${{ github.event.issue.number }}
      # Strips the Anthropic key from the agent's shell; GitHub tokens stay
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
    steps:
      - uses: actions/checkout@v7

      - name: Clear needs-human from an earlier run
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels/needs-human" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/subprocess-isolation

      # The end-state check below counts only what this round posted
      - name: Note when the round started
        run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /grill-with-docs The idea is GitHub issue #${{ github.event.issue.number }}.

            You run unattended in GitHub Actions. The issue thread is your conversation with the user, and this run is one round of it. Asking questions is this stage's normal output, not a reason for `needs-human`.

            1. Read the whole thread: `gh issue view ${{ github.event.issue.number }} --comments`. Your earlier rounds are the comments by claude[bot]; the human's answers come after them.
            2. Rebuild the design tree from the idea, the answers so far and the code. Look facts up yourself.
            3. If the frontier is not empty: post the next round as ONE comment, in the grilling format, and stop.
            4. If the frontier is empty: post ONE comment starting with `## Summary`. It is the spec for the next agent: what to build, every decision made, and what is out of scope. Where domain-modeling would update `GLOSSARY.md` or write an ADR, put the proposed text under `### Glossary` / `### ADR` instead; the implementing agent adds the files. End by asking the human to reply "ok" or correct it. Stop.
            5. If your `## Summary` is your latest comment and the human has confirmed it since: run `gh issue edit ${{ github.event.issue.number }} --remove-label idea --add-label grilled` and stop. If they corrected it, go back to step 2.

            Post every comment with `gh issue comment ${{ github.event.issue.number }} --body-file <file>`. Only what you post reaches the human: nobody sees your final reply.

            Never change repository files in this stage.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'sonnet' }}
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,Skill,Agent"

      # gh issue view shows bot logins without [bot] (GraphQL), unlike the REST API's claude[bot]
      - name: Check the agent posted a round or moved the idea on
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels,comments --jq '
            any(.labels[]; .name == "grilled" or .name == "needs-human") or
            any(.comments[]; .author.login == "claude" and .createdAt > env.STARTED)' | grep -qx true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/needs-human
        if: failure()
        with:
          number: ${{ env.NUMBER }}

  # Its own job, so the agent's token never gets actions: write. Skipped along with
  # grill, so a run where nothing ran stays skipped and the next prune deletes it.
  prune:
    needs: grill
    if: ${{ !cancelled() && needs.grill.result != 'skipped' }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-skipped-runs.yml
